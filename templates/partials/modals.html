<!-- Modal Sinopsis -->
<div class="modal-overlay" id="modalSinopsis" style="display: none;">
    <div class="modal-box">
        <div class="modal-header"><h3 id="sinopsisTitle">Sinopsis</h3><button class="close-btn" id="closeSinopsis">&times;</button></div>
        <div class="modal-body"><p id="sinopsisText" style="line-height: 1.6; color: #334155;"></p></div>
    </div>
</div>

<!-- Modal Notificaciones -->
<div class="modal-overlay" id="modalNotificaciones" style="display: none;">
    <div class="modal-box">
        <div class="modal-header"><h3>Notificaciones</h3><button class="close-btn" id="closeNotificaciones">&times;</button></div>
        <div class="modal-body" id="notificacionesLista"></div>
    </div>
</div>

<!-- Modal Solicitar -->
<div class="modal-overlay" id="modalSolicitar" style="display: none;">
    <div class="modal-box">
        <div class="modal-header"><h3>Confirmar Préstamo</h3><button class="close-btn" id="closeSolicitar">&times;</button></div>
        <div class="modal-body">
            <p style="margin-bottom: 15px; font-size: 16px;"><strong>Libro:</strong> <span id="solicitarLibroNombre"></span></p>
            <p style="margin-bottom: 15px; font-size: 14px; color: #64748b;"><strong>Fecha de Solicitud:</strong> <span id="solicitarFechaHoy"></span></p>
            <label style="display:block; font-size:14px; font-weight:600; margin-bottom:5px;">¿Para qué fecha lo necesitas de vuelta?</label>
            <input type="date" id="inputFechaEntrega" class="form-control" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; margin-bottom:20px;">
            <button class="btn-primary" id="btnConfirmarPrestamo">Enviar Solicitud al Administrador</button>
        </div>
    </div>
</div>

<!-- Modal Editar Libro -->
<div class="modal-overlay" id="modalEditarLibro" style="display: none;">
    <div class="modal-box">
        <div class="modal-header"><h3>Editar Información</h3><button class="close-btn" id="closeEditarLibro">&times;</button></div>
        <div class="modal-body">
            <input type="hidden" id="editTituloOriginal">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:5px;">Título:</label>
            <input type="text" id="editTitulo" class="form-control" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; margin-bottom:15px;">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:5px;">Autor:</label>
            <input type="text" id="editAutor" class="form-control" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; margin-bottom:15px;">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:5px;">Categoría:</label>
            <input type="text" id="editCategoria" class="form-control" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; margin-bottom:15px;">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:5px;">Sinopsis:</label>
            <textarea id="editSinopsis" class="form-control" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; height:80px; margin-bottom:15px;"></textarea>
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:5px;">Stock:</label>
            <input type="number" id="editStock" class="form-control" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; margin-bottom:20px;">
            <button class="btn-primary" id="btnGuardarEdicion">Guardar Cambios</button>
        </div>
    </div>
</div>

<!-- Modal Admin General -->
<div class="modal-overlay" id="modalAdmin" style="display: none;">
    <div class="modal-box" style="max-width: 700px;">
        <div class="modal-header"><h3 id="adminModalTitle">Admin</h3><button class="close-btn" id="closeAdmin">&times;</button></div>
        <div class="modal-body" id="adminModalContent"></div>
    </div>
</div>
