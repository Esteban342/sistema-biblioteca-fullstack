<header class="dashboard-header">
    <div class="logo-area">
        <i class="fa-solid fa-book-open"></i>
        <span class="logo-text">Biblioteca</span>
    </div>
    
    <div class="search-area" style="position: relative;">
        <div class="search-wrapper" style="flex-grow: 1; display: flex; align-items: center; position: relative;">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="searchInput" placeholder="Buscar por título, autor o usa operadores...">
        </div>
        
        <!-- Botón de Filtros -->
        <button class="btn-filter" id="btnAdvancedSearch" style="margin-left: 10px;">
            <i class="fa-solid fa-sliders"></i> Filtros
        </button>

        <!-- Panel de Filtros Desplegable (Estilo Prototipo) -->
        <div class="filter-panel" id="filterPanel">
            <div class="filter-grid">
                <div class="filter-group">
                    <label>Autor</label>
                    <input type="text" id="filterAuthor" placeholder="Ej. Gabriel García Márquez">
                </div>
                <div class="filter-group">
                    <label>Categoría</label>
                    <select id="filterCategory" class="filter-select">
                        <option value="all">Todas</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Año de publicación</label>
                    <select id="filterYear" class="filter-select">
                        <option value="all">Cualquiera</option>
                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                        <option value="2021">2021</option>
                        <option value="2020">2020</option>
                        <option value="2019">2019</option>
                    </select>
                </div>
            </div>
            
            <div class="filter-actions">
                <button class="btn-clear-filters" id="btnClearFilters">Limpiar</button>
                <button class="btn-apply" id="btnApplyFilters">Aplicar Filtros</button>
            </div>
        </div>
    </div>

    <div class="user-area">
        <div id="notification-area" class="notification-area" style="display: none;">
            <i class="fa-solid fa-bell"></i>
            <span class="badge" id="notifBadge" style="display: none;">!</span>
        </div>

        <div class="user-menu-container">
            <div class="user-info" id="userMenuBtn">
                <span id="userName">Cargando...</span>
                <span id="userRole" class="role-badge">Rol</span>
                <i class="fa-solid fa-chevron-down" style="font-size: 12px; margin-left: 8px; color: #64748b;"></i>
            </div>
            <div class="user-dropdown" id="userDropdown">
                <a href="#" id="logoutBtn">
                    <i class="fa-solid fa-right-from-bracket" style="color: #ef4444;"></i> Cerrar Sesión
                </a>
            </div>
        </div>
    </div>
</header>

<div class="admin-controls" id="adminControls" style="display: none;">
    <button class="btn-admin" id="btnVerSolicitudes">
        <i class="fa-solid fa-list-check"></i> Ver Solicitudes
        <span id="adminSolicitudesBadge" class="badge-admin" style="display: none;">0</span>
    </button>
    <button class="btn-admin" id="btnVerDevoluciones"><i class="fa-solid fa-rotate-left"></i> Registrar Devolución</button>
    <button class="btn-admin" id="btnAgregarLibro"><i class="fa-solid fa-plus"></i> Agregar Libro</button>
</div>
